plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'com.google.protobuf' version '0.9.5'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "screentextsaver" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // See: https://github.com/CottonMC/LibGui/wiki/Setup.
    maven {
        name = "CottonMC"
        url = "https://server.bbkr.space/artifactory/libs-release"
    }
    // See: https://shedaniel.gitbook.io/cloth-config/setup-cloth-config/cloth-config-fabric.
    maven { url "https://maven.shedaniel.me/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Cloth
    modApi "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    // Protobuf
    implementation "com.google.protobuf:protobuf-java:${project.protobuf_version}"
    include "com.google.protobuf:protobuf-java:${project.protobuf_version}"
    // Database
    implementation "org.postgresql:postgresql:${project.postgres_version}"
    include "org.postgresql:postgresql:${project.postgres_version}"
    // Hibernate
    implementation "org.hibernate.orm:hibernate-core:${project.hibernate_version}"
    include "org.hibernate.orm:hibernate-core:${project.hibernate_version}"
    // JPA
    implementation "jakarta.persistence:jakarta.persistence-api:${project.jpa_version}"
    include "jakarta.persistence:jakarta.persistence-api:${project.jpa_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${project.protobuf_version}" }
    generateProtoTasks {
        all().forEach { task ->
            task.builtins { java {} }
        }
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
